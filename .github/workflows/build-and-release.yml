name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v2.0.0 or v2.0.0-beta.1)'
        required: false
        default: ''
      apk_name:
        description: 'Custom APK Filename (leave empty for default)'
        required: false
        default: ''
      release_name:
        description: 'Release Title (leave empty for default)'
        required: false
        default: ''
      publish_to_release:
        description: 'Publish to GitHub Releases'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark as Pre-release (uncheck to set as Latest release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test

      - name: Configure Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.KEYSTORE || secrets.SIGNING_KEY || secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEY_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.STORE_PASS || secrets.KEY_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEY_PASS || secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS || secrets.ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            mkdir -p android/app
            echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/upload-keystore.jks
            cp android/app/upload-keystore.jks android/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" "$STORE_PASS" "$KEY_PASS" "$ALIAS" > android/key.properties
            echo "Keystore successfully configured."
          else
            echo "WARNING: KEYSTORE_BASE64 is not set. Falling back to debug signing."
          fi

      - name: Build 64-bit Release APK (ARM64 Only)
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEY_PASS || secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.STORE_PASS || secrets.KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation

      - name: Prepare Release Artifacts
        id: prep
        run: |
          PUBSPEC_VER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' \r\n')
          INPUT_TAG="${{ inputs.tag_name }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ -n "$PUBSPEC_VER" ]; then
            TAG="v$PUBSPEC_VER"
          else
            TAG="v2.0.0"
          fi

          INPUT_APK="${{ inputs.apk_name }}"
          if [ -n "$INPUT_APK" ]; then
            case "$INPUT_APK" in
              *.apk) APK_NAME="$INPUT_APK" ;;
              *) APK_NAME="${INPUT_APK}.apk" ;;
            esac
          else
            APK_NAME="Phantek-Vega-${TAG}-arm64-v8a.apk"
          fi

          cp build/app/outputs/flutter-apk/app-release.apk "${APK_NAME}"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.prep.outputs.apk_name }}
          path: |
            ${{ steps.prep.outputs.apk_name }}
            ${{ steps.prep.outputs.apk_name }}.sha256

      - name: Publish to GitHub Releases
        if: inputs.publish_to_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          name: ${{ inputs.release_name || format('{0}', steps.prep.outputs.tag_name) }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ !inputs.prerelease }}
          files: |
            ${{ steps.prep.outputs.apk_name }}
            ${{ steps.prep.outputs.apk_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
