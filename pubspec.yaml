name: phantek_video_toolkit_vega
description: "High-performance offline on-device video transcoding, downscaling, and audio extraction for Android powered by Hardware Acceleration (AndroidX Media3 Transformer)."
publish_to: 'none'

version: 2.1.4+21401

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  device_info_plus: ^13.3.0
  file_picker: ^13.2.0
  flutter_foreground_task: any
  open_file: ^4.0.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
